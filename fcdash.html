<title>Flashcard Dash</title>
<style>

*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:#F4F1F6;font-family:'Segoe UI',system-ui,Arial,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{background:radial-gradient(120% 80% at 50% -10%,#1E2A2C 0%,#121719 55%,#0D1012 100%);overflow:hidden}

.x{right:12px}.snd{left:12px}.snd svg{width:22px;height:22px}
.wrap{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center}
.kick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--mint);margin:6px 0 4px}
h1{font-family:Georgia,'Times New Roman',serif;font-size:40px;line-height:1.05;margin:0 0 6px;color:#FFF6E6;text-align:center}
.sub{color:var(--muted);text-align:center;margin:0 0 14px;font-size:15px;line-height:1.45}
.lvl{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#E9E3EE;margin:6px 0}
.path{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0 16px;max-width:360px}.path i{width:13px;height:13px;border-radius:4px;background:rgba(255,255,255,.13);transform:rotate(-6deg)}.path i.d{background:var(--mint)}.path i.c{background:var(--pink);box-shadow:0 0 0 3px rgba(244,179,194,.25)}.path i.h{outline:1.5px dashed rgba(255,255,255,.35);outline-offset:1px}
.fan{position:relative;width:220px;height:150px;margin:8px 0 14px}
.fan b{position:absolute;left:50%;top:14px;width:120px;height:84px;margin-left:-60px;border-radius:12px;background:var(--cream);box-shadow:0 8px 24px rgba(0,0,0,.4);border-top:9px solid var(--c)}
.fan b:nth-child(1){--c:var(--lil);transform:rotate(-16deg) translate(-40px,10px)}.fan b:nth-child(2){--c:var(--blue);transform:rotate(-5deg) translate(-12px,0)}.fan b:nth-child(3){--c:var(--pink);transform:rotate(6deg) translate(14px,2px)}.fan b:nth-child(4){--c:var(--mint);transform:rotate(17deg) translate(42px,14px)}
.fan b::after{content:"";position:absolute;left:14px;right:14px;top:22px;height:6px;border-radius:4px;background:#E6DFEA;box-shadow:0 14px 0 #EEE8F1,0 28px 0 #EEE8F1}

.go{border:0;border-radius:999px;background:var(--mint);color:#13301F;font-size:19px;font-weight:800;padding:15px 0;width:100%;cursor:pointer;font-family:inherit}
.go.alt{background:rgba(255,255,255,.12);color:#fff;font-weight:600;margin-top:10px}
.pick{margin-top:14px;background:rgba(255,255,255,.08);color:#ddd;border:0;border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
.count{font-family:Georgia,serif;font-size:110px;color:#FFF6E6;animation:pop .8s}@keyframes pop{0%{transform:scale(.4);opacity:0}40%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}

.lives{display:flex;gap:4px;min-width:90px}.lives svg{width:20px;height:20px}.lives .lost{opacity:.22}
.bar{width:100%;max-width:560px;height:9px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--mint);transform-origin:left;border-radius:9px}
.clock{width:100%;max-width:560px;text-align:right;font-size:12px;color:var(--muted);margin:4px 0 8px;font-variant-numeric:tabular-nums}

.card .q{font-size:21px;line-height:1.35;font-weight:700;margin:0;color:#2B2530}

.opts.duo{grid-template-columns:1fr 1fr}
.opt{min-height:56px;border:0;border-radius:16px;background:#2A2F35;color:#fff;font:inherit;font-size:17px;font-weight:600;padding:12px 14px;text-align:left;cursor:pointer;line-height:1.3;display:flex;gap:10px;align-items:center}

.opts.duo .opt{min-height:84px;font-size:18px;justify-content:center;text-align:center;flex-direction:column}
.opt:hover{background:#343A41}.opt.right{background:var(--mint);color:#13301F}.opt.right .k{background:rgba(0,0,0,.12)}.opt.wrong{background:var(--rose);color:#3A1218}
.hint{font-size:12px;color:#8E8796;margin-top:10px;text-align:center}
.big{font-family:Georgia,serif;font-size:44px;line-height:1.1;text-align:center;margin:10px 0 6px;color:#FFF6E6}
.stat{display:flex;gap:10px;width:100%;margin:12px 0}.stat div{flex:1;background:rgba(255,255,255,.06);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:22px}.stat small{color:var(--muted);font-size:12px}
.rev{width:100%;margin:6px 0 12px}.rev h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--pink);margin:0 0 8px}
.rev li{list-style:none;background:var(--cream);color:var(--ink);border-radius:12px;padding:9px 12px;margin-bottom:8px;font-size:15px;line-height:1.4;border-left:6px solid var(--c,var(--lil))}.rev li b{color:#1F6B45}.rev ul{padding:0;margin:0}
.flycards{position:fixed;inset:0;pointer-events:none;z-index:5}.flycards b{position:absolute;left:50%;top:40%;width:70px;height:48px;border-radius:9px;background:var(--cream);border-top:7px solid var(--c);animation:fly 1.6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fly{0%{transform:translate(-50%,0) rotate(0);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.flycards{display:none}.card,.count{animation:none!important;transition:none!important}}

 font-family=\"Segoe UI,Arial,sans-serif\"><rect x=\"40\" y=\"20\" width=\"240\" height=\"120\" rx=\"14\" fill=\"#E8E2EE\" stroke=\"#3B3340\" stroke-width=\"2.5\"/><rect x=\"56\" y=\"36\" width=\"208\" height=\"88\" rx=\"8\" fill=\"#F5F1F8\" stroke=\"#3B3340\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><circle cx=\"80\" cy=\"58\" r=\"7\" fill=\"none\" stroke=\"#5A1A2E\" stroke-width=\"2.2\"/><circle cx=\"80\" cy=\"58\" r=\"2\" fill=\"#5A1A2E\"/><circle cx=\"240\" cy=\"58\" r=\"7\" fill=\"none\" stroke=\"#5A1A2E\" stroke-width=\"2.2\"/><circle cx=\"240\" cy=\"58\" r=\"2\" fill=\"#5A1A2E\"/><circle cx=\"80\" cy=\"102\" r=\"7\" fill=\"none\" stroke=\"#5A1A2E\" stroke-width=\"2.2\"/><circle cx=\"80\" cy=\"102\" r=\"2\" fill=\"#5A1A2E\"/><circle cx=\"240\" cy=\"102\" r=\"7\" fill=\"none\" stroke=\"#5A1A2E\" stroke-width=\"2.2\"/><circle cx=\"240\" cy=\"102\" r=\"2\" fill=\"#5A1A2E\"/><circle cx=\"160\" cy=\"80\" r=\"7\" fill=\"none\" stroke=\"#5A1A2E\" stroke-width=\"2.2\"/><circle cx=\"160\" cy=\"80\" r=\"2\" fill=\"#5A1A2E\"/><text x=\"160\" y=\"156\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8A7D8F\">inside of a plastic casing</text></svg>", "draft": "<svg viewBox=\"0 0 320 160\" role=\"img\" aria-label=\"Section through a moulded cup with slightly tapered walls\" font-family=\"Segoe UI,Arial,sans-serif\"><path d=\"M70 30 L250 30 L230 130 L90 130Z\" fill=\"none\" stroke=\"#3B3340\" stroke-width=\"3\"/><path d=\"M84 40 L236 40 L220 120 L100 120Z\" fill=\"#E2ECFD\" stroke=\"#3B3340\" stroke-width=\"1.5\"/><path d=\"M70 30 V130\" stroke=\"#5A1A2E\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/><path d=\"M70 100 A30 30 0 0 0 76 100\" stroke=\"#5A1A2E\" stroke-width=\"2\" fill=\"none\"/><path d=\"M70 92 Q74 96 78 92\" stroke=\"#5A1A2E\" stroke-width=\"2\" fill=\"none\"/><text x=\"160\" y=\"152\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8A7D8F\">section through a moulded cup: walls taper slightly</text></svg>", "fcd": "<svg viewBox=\"0 0 200 120\" role=\"img\" aria-label=\"A flow chart symbol\" font-family=\"Segoe UI,Arial,sans-serif\"><path d=\"M100 10 L180 60 L100 110 L20 60Z\" fill=\"#FFF1D6\" stroke=\"#3B3340\" stroke-width=\"3\"/></svg>", "fct": "<svg viewBox=\"0 0 200 120\" role=\"img\" aria-label=\"A flow chart symbol\" font-family=\"Segoe UI,Arial,sans-serif\"><rect x=\"20\" y=\"30\" width=\"160\" height=\"60\" rx=\"30\" fill=\"#FFF1D6\" stroke=\"#3B3340\" stroke-width=\"3\"/></svg>", "fcp": "<svg viewBox=\"0 0 200 120\" role=\"img\" aria-label=\"A flow chart symbol\" font-family=\"Segoe UI,Arial,sans-serif\"><rect x=\"25\" y=\"30\" width=\"150\" height=\"60\" fill=\"#FFF1D6\" stroke=\"#3B3340\" stroke-width=\"3\"/></svg>", "fci": "<svg viewBox=\"0 0 200 120\" role=\"img\" aria-label=\"A flow chart symbol\" font-family=\"Segoe UI,Arial,sans-serif\"><path d=\"M50 30 H185 L150 90 H15Z\" fill=\"#FFF1D6\" stroke=\"#3B3340\" stroke-width=\"3\"/></svg>"};

/* Flashcard Dash (Higher D&M), v10.24. 20 levels. Levels 1-10: four answers. Levels 11-20: 50/50 between the answer and its closest look-alike.
   Cards per level = 7 + level. The clock is worked out from the words on each card (reading time) and gets tighter level by level. */
const MAXL=20,HARD=10;
const TNAME={'h-brief':'The design brief','h-research':'Research and evaluation','h-spec':'Specifications','h-ideas':'Idea generation','h-model':'Modelling','h-graphics':'Graphics','h-function':'Function','h-perf':'Performance','h-safety':'Safety','h-market':'Market','h-aesth':'Aesthetics','h-ergo':'Ergonomics','h-materials':'Materials','h-processes':'Commercial processes','h-features':'Finishes and features','h-assembly':'Assembly methods','h-production':'Production and planning','h-people':'People who influence design','h-ipr':'Intellectual property','h-impact':'Impact and sustainability'};
const TCOL=t=>/h-(brief|research|spec|ideas|model|graphics)/.test(t)?'var(--lil)':/h-(function|perf|safety|market|aesth|ergo)/.test(t)?'var(--pink)':/h-(materials|processes|features|assembly|production)/.test(t)?'var(--blue)':'var(--mint)';
const $=id=>document.getElementById(id);
const ST={get(k,d){try{const v=localStorage.getItem('fd-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('fd-'+k,JSON.stringify(v))}catch(e){}}};
let unlocked=ST.get('unl',1),best=ST.get('best',{}),misses=ST.get('miss',{}),bank=Math.min(3,ST.get('lives',0)),sound=ST.get('snd',true);
let L=Math.min(unlocked,MAXL),deck=[],cur=null,lives=0,TIME=60,tLeft=60,running=false,busy=false,raf=0,last=0,missedRun={},cleared=0;
const cardsFor=L=>7+L;
const words=s=>String(s).split(/\s+/).filter(Boolean).length;
const factor=L=>L<=HARD?1.6-(L-1)*0.6/9:1.25-(L-HARD-1)*0.4/9;
function optsFor(i,L){const c=BANK[i];if(L>HARD){const o=c[4]||c[3][0];return Math.random()<.5?[c[2],o]:[o,c[2]]}return [c[2],...c[3]].bmShuf()}
function allow(i,L){const c=BANK[i];const ow=L>HARD?words(c[2])+words(c[4]||c[3][0]):words(c[2])+c[3].reduce((a,x)=>a+words(x),0);return 2.5+0.32*words(c[1])+0.2*ow+(c[5]?2:0)}
function buildDeck(n){const pool=[];BANK.forEach((c,i)=>{const w=1+Math.min(3,misses[i]||0);for(let k=0;k<w;k++)pool.push(i)});const out=[];let g=0;
  while(out.length<n&&g++<6000){const i=pool[Math.random()*pool.length|0];if(out.includes(i))continue;
    if(out.length&&BANK[out[out.length-1]][0]===BANK[i][0]&&Math.random()<.7)continue;out.push(i)}return out}
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id))}
/* sound */
let AC=null;function tone(f,d,type='sine',v=.1,dl=0){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+dl;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const ding=n=>{tone(660+Math.min(n,8)*40,.18,'triangle',.09)},thud=()=>{tone(180,.35,'sine',.14)};
function drawSnd(){$('snd').innerHTML=sound?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'}
$('snd').onclick=()=>{sound=!sound;ST.set('snd',sound);drawSnd()};drawSnd();
$('x').onclick=()=>{stop();try{parent.postMessage('td-close','*')}catch(e){}};
/* ready */
function pathHTML(upto,hi){return Array.from({length:MAXL},(_,i)=>`<i class="${i+1<upto?'d':i+1===upto?'c':''}${i>=HARD?' h':''}"></i>`).join('')}
function setReady(l){L=Math.max(1,Math.min(l,unlocked,MAXL));const n=cardsFor(L),sample=buildDeck(n);const t=Math.round(sample.reduce((a,i)=>a+allow(i,L),0)*factor(L));
  $('rLvl').textContent=`Level ${L} of ${MAXL}`+(L>HARD?' · 50/50':'');$('rPath').innerHTML=pathHTML(L);$('rCards').textContent=n;$('rTime').textContent=fmt(t);$('rLives').textContent=2+bank;
  $('rNote').textContent=L>HARD?'50/50: each card has two answers that look alike. Read both carefully before you choose.':L===1?'Read each card and pick the right answer. You start with two lives. A wrong answer costs one and the card comes back later. Clear a level to unlock the next one, and keep any spare lives for the next round.':'Four answers on each card. The clock is set by how much there is to read on each card.';
  $('pick').innerHTML=Array.from({length:unlocked},(_,i)=>`<option value="${i+1}" ${i+1===L?'selected':''}>Level ${i+1}${i+1>HARD?' (50/50)':''}${best[i+1]?` · best ${fmt(best[i+1])} left`:''}</option>`).join('');
  const m=Object.keys(misses).length;$('rBank').textContent=`${BANK.length} cards across the Higher course`+(m?` · ${m} you’ve missed come up more often`:'');show('ready')}
$('pick').onchange=e=>setReady(+e.target.value);
$('begin').onclick=()=>countdown();
function countdown(){show('cd');$('cdL').textContent='Level '+L+(L>HARD?' · 50/50':'')+' · get ready';let n=3;const step=()=>{if(!$('cd').classList.contains('on'))return;if(n===0){start();return}$('cdN').textContent=n;$('cdN').style.animation='none';void $('cdN').offsetWidth;$('cdN').style.animation='';tone(n===1?523:392,.3,'sine',.1);n--;setTimeout(step,750)};step()}
/* play */
function start(){deck=buildDeck(cardsFor(L));TIME=Math.round(deck.reduce((a,i)=>a+allow(i,L),0)*factor(L));tLeft=TIME;lives=2+bank;missedRun={};cleared=0;busy=false;running=true;
  $('hLvl').textContent='Level '+L;show('play');drawLives();paint(true);last=performance.now();raf=requestAnimationFrame(tick)}
function stop(){running=false;cancelAnimationFrame(raf)}
function tick(now){if(!running)return;const dt=(now-last)/1000;last=now;if(!busy)tLeft-=dt;if(tLeft<=0){tLeft=0;upd();return end(false,'time')}upd();raf=requestAnimationFrame(tick)}
function upd(){const f=tLeft/TIME;const b=$('barIn');b.style.transform=`scaleX(${Math.max(0,f)})`;b.style.background=f<.12?'var(--rose)':f<.3?'var(--amber)':'var(--mint)';$('clock').textContent=fmt(tLeft)}
function drawLives(){$('lives').innerHTML=Array.from({length:Math.max(2,2+bank)},(_,i)=>`<span class="${i<lives?'':'lost'}"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9C1 8.4 3.2 4.5 7 4.5c2.2 0 3.6 1.2 5 3 1.4-1.8 2.8-3 5-3 3.8 0 6 3.9 4.3 7.5C19 16.4 12 21 12 21z" fill="#F2A0A8"/></svg></span>`).join('')}
function paint(first){cur=deck[0];const c=BANK[cur],card=$('card');card.className='card'+(first?'':' in');card.style.setProperty('--c',TCOL(c[0]));
  $('cTp').textContent=TNAME[c[0]]||'';$('cQ').textContent=c[1];$('cFig').innerHTML=c[5]&&FIGS[c[5]]?FIGS[c[5]]:'';$('cFig').hidden=!c[5];
  const os=optsFor(cur,L);$('opts').className='opts'+(L>HARD?' duo':'');$('opts').innerHTML=os.map((o,k)=>`<button type="button" class="opt" data-a="${o===c[2]?1:0}"><span class="k">${k+1}</span><span>${o.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span></button>`).join('');
  [...$('opts').children].forEach(b=>b.onclick=()=>answer(b));$('left').textContent=deck.length+' left';
  if(!first)requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.remove('in')))}
function answer(b){if(busy||!running)return;busy=true;const card=$('card');
  if(b.dataset.a==='1'){b.classList.add('right');card.classList.add('ok');ding(++cleared);if(misses[cur]){misses[cur]--;if(!misses[cur])delete misses[cur];ST.set('miss',misses)}
    setTimeout(()=>{card.classList.add('out');setTimeout(()=>{deck.shift();busy=false;if(!deck.length)return end(true);paint()},230)},420)}
  else{b.classList.add('wrong');[...$('opts').children].find(x=>x.dataset.a==='1').classList.add('right');card.classList.add('bad');thud();try{navigator.vibrate&&navigator.vibrate([30,40,30])}catch(e){}
    missedRun[cur]=1;misses[cur]=(misses[cur]||0)+1;ST.set('miss',misses);lives--;drawLives();
    setTimeout(()=>{if(lives<=0){busy=false;return end(false,'lives')}const id=deck.shift();deck.push(id);card.classList.add('out');setTimeout(()=>{busy=false;paint()},230)},1500)}}
document.addEventListener('keydown',e=>{if(!$('play').classList.contains('on'))return;const n=+e.key;if(n>=1&&n<=4){const b=$('opts').children[n-1];if(b)b.click()}});
function revHTML(){const ids=Object.keys(missedRun).map(Number);if(!ids.length)return '';return `<div class="rev"><h3>Cards to revise</h3><ul>${ids.map(i=>`<li style="--c:${TCOL(BANK[i][0])}">${BANK[i][1].replace(/</g,'&lt;')} <b>${BANK[i][2].replace(/</g,'&lt;')}</b></li>`).join('')}</ul></div>`}
function fly(){const f=document.createElement('div');f.className='flycards';const cs=['var(--lil)','var(--pink)','var(--blue)','var(--mint)'];f.innerHTML=Array.from({length:18},(_,i)=>`<b style="--c:${cs[i%4]};--dx:${(Math.random()*2-1)*45}vw;--dy:${-20-Math.random()*50}vh;--r:${(Math.random()*2-1)*200}deg;animation-delay:${i*40}ms"></b>`).join('');document.body.appendChild(f);setTimeout(()=>f.remove(),2600)}
function end(won,why){stop();const tl=Math.ceil(tLeft),wasL=L;let html;
  if(won){bank=Math.min(3,lives-1);ST.set('lives',bank);const pb=!best[L]||tl>best[L];if(pb){best[L]=tl;ST.set('best',best)}if(L>=unlocked&&L<MAXL){unlocked=L+1;ST.set('unl',unlocked)}
    const lastL=L>=MAXL;tone(523,.2,'triangle',.1);tone(659,.2,'triangle',.1,.12);tone(784,.35,'triangle',.1,.24);fly();
    html=`<div class="kick">Level ${L} cleared</div><div class="big">${lastL?'Flashcard master!':['Sharp!','Nailed it!','On fire!','Top marks!'][(L-1)%4]}</div>
     <p class="sub">${lastL?'You cleared all 20 levels.':`Level ${L+1} unlocked`+(L+1===HARD+1?': now it’s 50/50 look-alikes.':'.')}</p><div class="path">${pathHTML(L+1)}</div>
     <div class="stat"><div><b>${fmt(tl)}</b><small>time left${pb?' · best!':''}</small></div><div><b>${Math.max(0,lives)}</b><small>lives kept · spare ${bank}</small></div></div>${revHTML()}
     <button class="go" id="nx" type="button">${lastL?'Play level 20 again':'Next level'}</button><button class="go alt" id="again" type="button">Play level ${L} again</button>`}
  else{bank=0;ST.set('lives',0);tone(220,.4,'sine',.12);tone(165,.5,'sine',.1,.15);
    html=`<div class="kick">Level ${L}</div><div class="big">${why==='time'?'Out of time':'Out of lives'}</div><p class="sub">${cleared} of ${cardsFor(L)} cards done. ${why==='time'?'Read each card once, then trust your first answer.':'Every card you got wrong is below, with its answer.'}</p>${revHTML()}
     <button class="go" id="again" type="button">Try again</button><button class="go alt" id="home" type="button">Levels</button>`}
  $('endW').innerHTML=html;show('end');
  const nx=$('nx');if(nx)nx.onclick=()=>setReady(Math.min(wasL+1,MAXL));$('again').onclick=()=>{L=wasL;countdown()};const hm=$('home');if(hm)hm.onclick=()=>setReady(wasL)}
setReady(L);

</script></body></html>
