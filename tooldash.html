<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tool Dash · BenchMark</title>
<style>
:root{--claret:#5A1A2E;--cream:#FFFBF5;--ink:#3B3340;--muted:#8A7D8F;--mint:#7CC9A0;--amber:#F2C46D;--rose:#F2A0A8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#EFE8E1;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;color:var(--ink)}
.phone{max-width:460px;margin:0 auto;min-height:100vh;background:var(--cream);padding:18px 16px 40px}
.mocknote{font-size:12px;color:var(--muted);background:#F3E8FA;border-radius:10px;padding:8px 12px;margin-bottom:14px}
.brand{font-weight:800;color:var(--claret);font-size:20px;margin:2px 0 14px}
.tile{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;margin-bottom:12px;cursor:pointer;box-shadow:0 2px 12px rgba(90,26,46,.12)}
.tile .lab{position:absolute;left:14px;bottom:12px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.tile .lab b{display:block;font-size:20px}.tile .lab span{font-size:13px;opacity:.9}
.tile .play{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.92);color:var(--claret);font-weight:700;border-radius:999px;padding:7px 16px;font-size:14px}
.zen svg{width:100%;height:100%;display:block}
.fz{background:radial-gradient(120% 90% at 70% 20%,#3a2a33 0%,#1b171d 60%,#121014 100%)}
.fz .fan{position:absolute;right:20%;top:13%;width:32%;height:64%}
.tchip{position:absolute;left:14px;top:12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#F5DFAF;border:1px solid rgba(233,201,139,.45);border-radius:999px;padding:4px 10px}
.ttl{font-size:26px!important;letter-spacing:.01em}
.path{display:flex;gap:4px;margin-top:6px}.path i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22)}.path i.d{background:#7CC9A0}.path i.c{background:#F5DFAF;box-shadow:0 0 8px #F5DFAF}
.fz .fan div{position:absolute;inset:0;background:#fff;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;overflow:hidden}
.fz .fan div:nth-child(1){transform:rotate(-14deg) translate(-26px,6px);filter:brightness(.6)}
.fz .fan div:nth-child(2){transform:rotate(-6deg) translate(-12px,2px);filter:brightness(.8)}
.fz .fan div:nth-child(3){transform:rotate(4deg)}
.fz .fan img{max-width:86%;max-height:86%}
.spurts{background:#fff;border-radius:16px;padding:10px 12px 8px;margin:0 0 14px;box-shadow:0 1px 6px rgba(90,26,46,.07)}
.spurts h4{margin:0 0 4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#9B7FA6}
.pots{display:flex;gap:6px;justify-content:space-between}
.pot{flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer;border-radius:12px;padding:4px 0}
.pot:active{background:#F6EFE3}
.pot svg{width:56px;height:56px}
.pot small{font-size:11px;color:var(--muted)}
.sap{transform-origin:28px 30px;transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
.pot.empty .sap{transform:scaleY(0)}
.pot.empty .potbody{fill:none;stroke:#C9B8A8;stroke-dasharray:3 3}
.pot.empty .soil{fill:#EFE6DC}
.topics{opacity:.55}.topics div{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;font-weight:600;color:var(--claret)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--claret);color:#fff;padding:12px 16px;border-radius:14px;max-width:86vw;width:380px;font-size:15px;opacity:0;transition:.3s;z-index:50;pointer-events:none;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* full screen game */
#fz{position:fixed;inset:0;z-index:20;display:none;color:#F4EEE8;background:radial-gradient(130% 100% at 50% 110%,#3b2440 0%,#1a1430 48%,#0b0a18 100%);overflow:hidden}
.scr{position:relative;z-index:1}
#fz.on{display:flex;flex-direction:column}
.x{position:absolute;z-index:9!important;top:max(12px,env(safe-area-inset-top));right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:20px;z-index:5;cursor:pointer}
.scr{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px 24px;max-width:460px;width:100%;margin:0 auto}
.scr.on{display:flex}
.lvl{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#C9B6C6}
.big{font-size:30px;font-weight:800;margin:6px 0 4px;text-align:center}
.rank{font-size:14px;color:#E9C98B;margin-bottom:18px}
.rank{padding:4px 12px;border:1px solid rgba(233,201,139,.45);border-radius:999px;font-size:12px!important;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin:0 0 10px!important}
.path.big2{margin:10px 0 16px;gap:6px}.path.big2 i{width:12px;height:12px}
.intro{font-size:18px;text-align:center;margin:0 0 18px;color:#EDE4EC}
.pwinfo{width:100%;background:rgba(255,255,255,.05);border-radius:16px;padding:14px 14px 10px;margin-bottom:22px}
.pwh{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#E9C98B;font-weight:700;margin-bottom:10px}
.pwrow{display:flex;gap:12px;align-items:center;margin-bottom:10px;font-size:15px;color:#D8CED6}.pwrow b{display:block;color:#fff;font-size:15px}
.pwrow span{flex:none;width:38px;height:38px;border-radius:12px;background:rgba(233,201,139,.15);display:flex;align-items:center;justify-content:center}
.pwrow svg,.pw svg{width:22px;height:22px}
.pwnote{font-size:12px;color:#9a8f99}
.rules{list-style:none;padding:0;margin:0 0 22px;width:100%}
.rules li{background:rgba(255,255,255,.06);border-radius:12px;padding:11px 14px;margin-bottom:8px;font-size:16px;display:flex;gap:10px;align-items:center}
.rules li i{font-style:normal;width:24px;text-align:center}
.go{border:0;border-radius:999px;background:var(--mint);color:#123322;font-size:19px;font-weight:800;padding:15px 0;width:100%;cursor:pointer}
.go.alt{background:rgba(255,255,255,.12);color:#fff;font-weight:600;margin-top:10px}
.mockrow{margin-top:18px;font-size:12px;color:#9a8f99;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.mockrow select,.mockrow label{background:rgba(255,255,255,.08);color:#ddd;border:0;border-radius:8px;padding:5px 8px;font-size:12px}
.count{font-size:96px;font-weight:800;color:#fff;animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:.9}}

/* play */
#play{justify-content:flex-start;padding-top:max(14px,env(safe-area-inset-top))}
.hud{width:100%;display:flex;align-items:center;gap:10px;padding-right:48px;margin-bottom:8px}
.lives{display:flex;gap:4px}
.lives span{width:22px;height:22px;transition:.3s}
.lives span.lost{opacity:.18;transform:scale(.8)}
.hud .lv{font-size:13px;color:#C9B6C6;flex:1;text-align:center}
.hud .left{font-size:13px;color:#C9B6C6}
.bar{width:100%;height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:6px}
.bar div{height:100%;width:100%;background:var(--mint);border-radius:8px;transform-origin:left;transition:background .4s}
.bar.frozen div{background:#9FD3F2}
.clock{font-size:12px;color:#9a8f99;align-self:flex-end;margin-bottom:6px;font-variant-numeric:tabular-nums}
.stack{position:relative;width:100%;aspect-ratio:4/3;max-height:42vh;margin:6px 0 16px}
.card{position:absolute;inset:0;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .32s cubic-bezier(.3,.7,.3,1),opacity .32s,box-shadow .2s}
.card img{max-width:88%;max-height:88%;object-fit:contain}
.card svg{width:84%;height:auto}
.card.b1{transform:translateY(-10px) scale(.95);opacity:.55;filter:brightness(.7)}
.card.b2{transform:translateY(-20px) scale(.9);opacity:.3;filter:brightness(.55)}
.card.top{z-index:3}
.card.ok{box-shadow:0 0 0 5px var(--mint),0 0 40px rgba(124,201,160,.7)}
.card.bad{box-shadow:0 0 0 5px var(--rose),0 0 30px rgba(242,160,168,.6);animation:shake .35s}
.card.fly{transform:translate(120%,-30px) rotate(18deg);opacity:0}
.card.back{transform:translateY(40px) scale(.9);opacity:0}
.card .tick{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px;color:var(--mint);opacity:0;transition:.15s;text-shadow:0 2px 10px rgba(255,255,255,.8)}
.card.ok .tick{opacity:1}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opt{border:0;border-radius:14px;min-height:62px;padding:10px 8px;background:rgba(255,255,255,.1);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s,opacity .2s}
.opt:active{transform:scale(.97)}
.opt.right{background:var(--mint);color:#123322}
.opt.wrong{background:var(--rose);color:#3a1218}
.opt.gone{opacity:.15;pointer-events:none}
.streak{display:flex;gap:6px;margin:16px 0 8px}
.streak span{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.14);transition:.2s}
.streak span.on{background:#E9C98B;box-shadow:0 0 10px #E9C98B}
.pwr{display:flex;gap:10px;width:100%}
.pw{flex:1;border:1px dashed rgba(255,255,255,.18);border-radius:14px;min-height:50px;background:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.pw.full{border:0;background:rgba(233,201,139,.18);color:#F5DFAF;font-weight:700;animation:glow 1.6s infinite alternate}
@keyframes glow{to{background:rgba(233,201,139,.3)}}
.pw:disabled{cursor:default}
.hint{font-size:12px;color:#8d8390;margin-top:6px;text-align:center}
.flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:4}
.flash.g{background:radial-gradient(circle,rgba(124,201,160,.0) 30%,rgba(124,201,160,.25));animation:fl .35s}
.flash.r{background:radial-gradient(circle,rgba(242,160,168,0) 30%,rgba(242,160,168,.28));animation:fl .4s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.calm .flash,.calm .card.ok{animation:none}
.calm .card.ok{box-shadow:0 0 0 4px var(--mint)}
.calm .card.bad{animation:none}

/* end */
.potbig svg{width:110px;height:110px}
.stat{display:flex;gap:10px;width:100%;margin:10px 0 18px}
.stat div{flex:1;background:rgba(255,255,255,.06);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat small{color:#B9AEB7;font-size:12px}
.miss{width:100%;font-size:14px;color:#D8CED6;margin-bottom:14px}
.miss b{color:#fff}
.share{background:linear-gradient(135deg,#F3E8FA,#E2F4EA);color:var(--claret);border-radius:20px;padding:20px;width:100%;text-align:center;margin-bottom:16px}
.share .big{color:var(--claret)}
.share code{font-size:20px;letter-spacing:.15em;font-weight:800;color:#2F6B49}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:6}

/* ===== night-sky theme ===== */
.nsky{background:radial-gradient(130% 100% at 50% 110%,#3b2440 0%,#1a1430 48%,#0b0a18 100%)!important}
.stars{position:absolute;left:0;top:0;width:1px;height:1px;border-radius:50%;background:transparent}
.tw1{animation:twk 3.2s ease-in-out infinite alternate}.tw2{animation:twk 4.6s ease-in-out -2s infinite alternate}.tw3{animation:twk 2.4s ease-in-out -1s infinite alternate}
@keyframes twk{from{opacity:.25}to{opacity:1}}
.shoot{position:absolute;top:10%;left:60%;width:90px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,246,218,0),#FFF6DA);opacity:0;transform:rotate(-24deg);animation:shoot 7s ease-in 2s infinite}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-24deg)}2%{opacity:1}9%{opacity:0;transform:translate(-160px,72px) rotate(-24deg)}100%{opacity:0;transform:translate(-160px,72px) rotate(-24deg)}}
.gold{background:linear-gradient(100deg,#FFF6DA 0%,#F5DFAF 40%,#E9A96B 60%,#FFF6DA 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;filter:drop-shadow(0 2px 10px rgba(245,190,120,.35))}
.fz .ttl.gold{text-shadow:none}
.mrock{position:absolute;right:7%;top:16%;width:34px;height:68px;animation:bob 2.6s ease-in-out infinite}
.mrock svg{width:100%;height:100%;overflow:visible}
.mrock .flm,.rrock .flm{transform-origin:42px 120px;animation:flk .12s steps(2) infinite alternate}
@keyframes flk{from{transform:scale(.95,.75)}to{transform:scale(1.05,.95)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(4deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.fz .fan div:nth-child(1){animation:fl1 5s ease-in-out infinite}.fz .fan div:nth-child(2){animation:fl2 6s ease-in-out infinite}.fz .fan div:nth-child(3){animation:fl3 5.5s ease-in-out infinite}
@keyframes fl1{0%,100%{transform:rotate(-14deg) translate(-26px,6px)}50%{transform:rotate(-16deg) translate(-30px,1px)}}
@keyframes fl2{0%,100%{transform:rotate(-6deg) translate(-12px,2px)}50%{transform:rotate(-5deg) translate(-12px,-4px)}}
@keyframes fl3{0%,100%{transform:rotate(4deg)}50%{transform:rotate(6deg) translate(3px,-6px)}}
.calm .shoot,.calm .floatc,.calm .mrock,.calm .rrock{animation:none!important}
/* ready screen */
#ready{position:relative}
.rtitle{font-size:clamp(46px,14vw,62px);font-weight:900;letter-spacing:-.01em;margin:0 0 8px;white-space:nowrap}
.rtitle span{display:inline-block;opacity:0;transform:translateY(-40px) scale(.6)}
#ready.on .rtitle span{animation:ldrop .7s cubic-bezier(.2,1.7,.4,1) forwards}
@keyframes ldrop{to{opacity:1;transform:none}}
.rtitle.shim span{animation:none!important;opacity:1;transform:none}
.rtitle.shim{animation:shim 1.6s ease-in-out}
@keyframes shim{from{background-position:100% 0}to{background-position:-50% 0}}
.stage{position:relative;width:100%;height:min(32vh,240px);margin:6px 0 18px}
.floatc{position:absolute;width:86px;height:86px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.floatc img{max-width:84%;max-height:84%}.floatc svg{width:84%}
.fc1{left:2%;top:12%;animation:o1 6s ease-in-out infinite}.fc2{right:2%;top:4%;animation:o2 7s ease-in-out infinite}.fc3{right:10%;bottom:0;width:70px;height:70px;animation:o3 5.5s ease-in-out infinite}
@keyframes o1{0%,100%{transform:rotate(-10deg) translateY(0)}50%{transform:rotate(-6deg) translateY(-12px)}}
@keyframes o2{0%,100%{transform:rotate(9deg) translateY(0)}50%{transform:rotate(5deg) translateY(10px)}}
@keyframes o3{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(-9deg) translateY(-9px)}}
.stage{height:min(38vh,250px)!important;margin:4px 0 18px!important}.stagesvg{width:100%;height:100%;overflow:visible}.stagesvg .flm{display:none}
.blink{animation:bl 1.2s steps(2) infinite}.blink2{animation:bl .5s steps(2) infinite}@keyframes bl{50%{opacity:.15}}
.wisp{animation:wsp 2.6s ease-out infinite}@keyframes wsp{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(2.4);opacity:0}}
.wisp circle{transform-box:fill-box;transform-origin:center}
.spk{animation:spk 1.7s steps(1) infinite}@keyframes spk{0%,60%{opacity:0}62%{opacity:1;transform:translate(0,0)}80%{opacity:1;transform:translate(3px,-4px)}82%,100%{opacity:0}}
.rrock{position:absolute;left:50%;bottom:0;width:64px;height:128px;margin-left:-32px;transition:transform .9s cubic-bezier(.6,0,.9,.4)}
.rrock .idle{width:100%;height:100%;animation:bob2 2.4s ease-in-out infinite}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.rrock svg{width:100%;height:100%;overflow:visible}
.rglow{position:absolute;left:50%;bottom:-18px;width:150px;height:60px;margin-left:-75px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,214,150,.35),rgba(255,214,150,0));animation:gl 2.4s ease-in-out infinite}
@keyframes gl{50%{transform:scale(.85);opacity:.7}}
.rrock.launch{transform:translateY(-120vh)}
#begin{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(124,201,160,.0)}50%{box-shadow:0 0 22px 2px rgba(124,201,160,.45)}}
#bgsky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* ===== level-up celebration ===== */
#cel{position:absolute;inset:0;z-index:7;display:none;overflow:hidden;background:radial-gradient(130% 90% at 50% 100%,#3b2440 0%,#1a1430 45%,#0b0a18 100%)}
#cel.on{display:block}
#celc{position:absolute;inset:0;width:100%;height:100%}
#rocket{position:absolute;left:50%;top:0;width:84px;height:168px;margin-left:-42px;will-change:transform}
#rocket svg{width:100%;height:100%;overflow:visible}
.flm{transform-origin:42px 128px}
.hl{position:absolute;left:0;right:0;top:20%;text-align:center;pointer-events:none}
.hl .w{display:inline-block;margin:0 .1em;font-size:clamp(44px,13vw,64px);font-weight:900;letter-spacing:-.01em;line-height:1.02;opacity:0;transform:translateY(30px) scale(.4);
 background:linear-gradient(180deg,#FFF6DA 0%,#F5DFAF 45%,#E9A96B 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(245,190,120,.45))}
.hl.in .w{animation:wpop .7s cubic-bezier(.2,1.7,.4,1) forwards}
.hl.in .w:nth-child(2){animation-delay:.12s}.hl.in .w:nth-child(3){animation-delay:.24s}
@keyframes wpop{to{opacity:1;transform:none}}
.hl .sub{margin-top:12px;font-size:17px;color:#EDE4EC;opacity:0;transform:translateY(10px);transition:.5s .45s}
.hl.in .sub{opacity:1;transform:none}
.hl .path{justify-content:center;margin-top:14px;gap:7px;opacity:0;transition:.4s .6s}.hl.in .path{opacity:1}
.hl .path i{width:12px;height:12px;transition:background .3s,box-shadow .3s}
.hl .path i.ign{animation:ign 1s ease-out .9s both}
@keyframes ign{0%{background:rgba(255,255,255,.22);box-shadow:0 0 0 0 rgba(245,223,175,.9)}40%{background:#F5DFAF;box-shadow:0 0 0 12px rgba(245,223,175,0)}100%{background:#F5DFAF;box-shadow:0 0 10px #F5DFAF}}
.celd{position:absolute;left:0;right:0;bottom:0;padding:0 20px max(22px,env(safe-area-inset-bottom));max-width:460px;margin:0 auto;opacity:0;transform:translateY(40px);transition:opacity .6s,transform .7s cubic-bezier(.2,1.2,.4,1)}
.celd.in{opacity:1;transform:none}
.celd .row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.07);border-radius:16px;padding:8px 14px;margin-bottom:10px;color:#F4EEE8}
.celd .row .pot svg{width:52px;height:52px}
.celd .row b{display:block;font-size:16px}.celd .row small{color:#C9B6C6;font-size:13px}
.celd .stat{margin:0 0 10px}
.celd .lnk{display:block;text-align:center;color:#B9AEB7;font-size:14px;margin-top:12px;background:none;border:0;width:100%;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.shake{animation:shk .5s linear}
@keyframes shk{10%,50%,90%{transform:translate(-3px,1px)}30%,70%{transform:translate(3px,-1px)}}

#home{display:none!important}html,body{background:#121014;touch-action:manipulation}
#fz{touch-action:manipulation}
.card{background:radial-gradient(110% 90% at 50% 35%,#3b3a46,#22212b 75%)!important;border:1px solid rgba(255,255,255,.14)}
.card .spin3d{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.card.b1{transform:translateY(-14px) scale(.94)!important;opacity:1!important;filter:brightness(.6)!important}
.card.b2{transform:translateY(-28px) scale(.88)!important;opacity:1!important;filter:brightness(.42)!important}
.sndb{position:fixed;left:14px;top:max(14px,env(safe-area-inset-top));z-index:40;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.sndb svg{width:22px;height:22px}.sndb[aria-pressed="false"]{color:#9a96a6}
#play .hud{padding-left:52px}
.lvsub{font-size:14px;color:#cfc8d8;text-align:center;max-width:320px;margin:4px auto 8px;line-height:1.4}

function buildDeck(n){

 const nT=L>HARD?Object.keys(TWINS).filter(k=>byId[k]).length:T.length;
 const out=[];let guard=0;
 while(out.length<n&&guard++<5000){const id=pool[Math.random()*pool.length|0];
  if(out[out.length-1]===id)continue;

  out.push(id)}

function choicesFor(id){
 if(L>HARD){const tw=(TWINS[id]||[]).filter(x=>byId[x]);const g=(GROUP[grpOf(id)]||[]).filter(x=>x!==id&&byId[x]);const o=tw.length?tw[Math.random()*tw.length|0]:g.length?g[Math.random()*g.length|0]:T.find(t=>t.id!==id).id;return Math.random()<.5?[id,o]:[o,id]}

  <div class="rank">${cleared} of ${total} named. So close. Have another go.</div>
  ${missList()}
  <button class="go" id="again">Try level ${L} again</button><button class="go alt" id="home2">Back to BenchMark</button>`;
 show('end');$('again').onclick=()=>countdown();$('home2').onclick=closeFz}
function missList(){const ids=Object.keys(missedRun);if(!ids.length)return '';return `<div class="miss">Worth another look: ${ids.map(id=>'<b>'+byId[id].n+'</b>').join(', ')}. These will come up more often.</div>`}
function checkCode(l,t){let h=2166136261;const s=`${l}|${t}|${today}|bm`;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(36).toUpperCase().slice(0,4)}
function shareCard(l,t,code){const rankOf=()=>'Tool Dash';$('end').innerHTML=`<div class="share"><div class="lvl" style="color:#9B7FA6">Tool Dash · ${new Date().toLocaleDateString('en-GB')}</div><div class="big">Level ${l}</div><div style="font-size:16px;margin-bottom:10px">${t}s to spare</div><div style="font-size:12px;color:#8A7D8F">Check code</div><code>${code}</code></div>
 <div class="rank" style="text-align:center">Screenshot this and show your teacher.</div><button class="go alt" id="home2">Back to BenchMark</button>`;$('home2').onclick=closeFz}

function confetti(){const c=$('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=['#7CC9A0','#F2C46D','#F2A0A8','#E2ECFD','#F3E8FA','#E9C98B'];
 const P=Array.from({length:110},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*10-3,r:Math.random()*6+3,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
 let f=0;(function d(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++f<150)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height)})()}
{const b=$('sndb'),c=$('snd');const on=S.get('snd',true);c.checked=on;
 const draw=()=>{b.innerHTML=c.checked?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>';b.setAttribute('aria-pressed',c.checked);b.setAttribute('aria-label',c.checked?'Sound on':'Sound off')};draw();
 b.onclick=()=>{c.checked=!c.checked;S.set('snd',c.checked);draw()}}
openFz();
